# Include inside ONLY the www.ralfepoisson.com VirtualHost.
# Shared TLS ingress continues to terminate HTTPS; application stays on loopback.
ProxyPassMatch "^/flashcards$" "http://127.0.0.1:48100/flashcards" retry=0 timeout=30
ProxyPass        /flashcards/ http://127.0.0.1:48100/flashcards/ retry=0 timeout=30
ProxyPassReverse /flashcards/ http://127.0.0.1:48100/flashcards/
<Location /flashcards>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</Location>
